<!DOCTYPE html>
<html>
<head>
    <title>Detection Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
        }

        .result {
            font-size: 30px;
            font-weight: bold;
            margin: 25px;
        }

        .confidence {
            font-size: 20px;
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔍 Deepfake Detection Result</h1>

    <p><b>File Type:</b> {{ file_type }}</p>

    <p><b>File:</b> {{ filename }}</p>

    <div class="result">
        {{ result }}
    </div>

    <div class="confidence">
        Confidence: {{ confidence }}%
    </div>

    <a href="/">
        🔄 Check Another File
    </a>

</div>

</body>
</html>
